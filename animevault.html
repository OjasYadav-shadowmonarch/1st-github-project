<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnimeVault — Discover Top Anime</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #080814;
    --surface: #0f0e1e;
    --card: #13122a;
    --card-hover: #1a1832;
    --border: rgba(160, 100, 255, 0.15);
    --border-hover: rgba(160, 100, 255, 0.45);
    --purple: #7c3aed;
    --purple-light: #a855f7;
    --purple-glow: rgba(124, 58, 237, 0.3);
    --pink: #ec4899;
    --text: #e8e0f5;
    --text-muted: rgba(200, 180, 255, 0.55);
    --text-dim: rgba(200, 180, 255, 0.35);
    --gold: #fbbf24;
    --green: #4ade80;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* BG grid pattern */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(124,58,237,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,58,237,0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── HEADER ── */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(8,8,20,0.92);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex; align-items: center; gap: 2rem;
    height: 64px;
  }

  .logo {
    font-family: 'Cinzel', serif;
    font-size: 22px; font-weight: 700;
    color: var(--purple-light);
    letter-spacing: 2px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .logo em { color: var(--pink); font-style: normal; }

  .search-wrap {
    flex: 1; max-width: 480px;
    position: relative;
  }
  .search-wrap svg {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; opacity: 0.4;
  }
  #searchInput {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 30px;
    padding: 9px 18px 9px 38px;
    color: var(--text);
    font-size: 14px; font-family: 'Nunito', sans-serif;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  #searchInput::placeholder { color: var(--text-dim); }
  #searchInput:focus {
    border-color: rgba(160,100,255,0.6);
    background: rgba(255,255,255,0.09);
  }

  .header-actions { display: flex; align-items: center; gap: 10px; margin-left: auto; }

  .watchlist-btn {
    background: rgba(124,58,237,0.18);
    border: 1px solid rgba(160,100,255,0.3);
    border-radius: 24px;
    padding: 7px 16px;
    color: var(--purple-light);
    font-size: 13px; font-weight: 700; font-family: 'Nunito', sans-serif;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    transition: all 0.2s; white-space: nowrap;
  }
  .watchlist-btn:hover { background: rgba(124,58,237,0.35); }
  .watchlist-btn .badge {
    background: var(--purple);
    color: #fff;
    font-size: 11px; font-weight: 800;
    width: 18px; height: 18px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }

  /* ── HERO BANNER ── */
  .hero {
    position: relative; z-index: 1;
    text-align: center;
    padding: 3.5rem 2rem 2.5rem;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute; top: -60px; left: 50%; transform: translateX(-50%);
    width: 700px; height: 400px;
    background: radial-gradient(ellipse at 50% 30%, rgba(124,58,237,0.22) 0%, transparent 65%);
    pointer-events: none;
  }
  .hero-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(32px, 5vw, 52px);
    font-weight: 700;
    line-height: 1.1;
    position: relative;
  }
  .hero-title .line1 { color: var(--text); display: block; }
  .hero-title .line2 {
    color: transparent;
    -webkit-text-stroke: 1px rgba(160,100,255,0.6);
    display: block;
  }
  .hero-sub {
    margin-top: 1rem;
    color: var(--text-muted);
    font-size: 15px;
    position: relative;
  }
  .hero-stats {
    display: flex; justify-content: center; gap: 2.5rem;
    margin-top: 1.8rem; position: relative;
  }
  .hero-stat-val { font-size: 24px; font-weight: 800; color: var(--purple-light); }
  .hero-stat-label { font-size: 11px; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }

  /* ── CONTROLS ── */
  .controls {
    position: sticky; top: 64px; z-index: 90;
    background: rgba(8,8,20,0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0.8rem 2rem;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  }

  .filter-label { font-size: 11px; color: var(--text-dim); letter-spacing: 1.5px; text-transform: uppercase; flex-shrink: 0; }

  .pill {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 12px; font-weight: 700; font-family: 'Nunito', sans-serif;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
  }
  .pill:hover { background: rgba(124,58,237,0.2); border-color: rgba(160,100,255,0.4); color: var(--text); }
  .pill.active { background: rgba(124,58,237,0.35); border-color: rgba(160,100,255,0.7); color: #e8d5ff; }

  .divider { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }

  .sort-select {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 10px;
    color: var(--text-muted);
    font-size: 12px; font-family: 'Nunito', sans-serif;
    cursor: pointer; outline: none;
  }
  .sort-select:focus { border-color: rgba(160,100,255,0.5); }

  /* ── MAIN LAYOUT ── */
  .main { position: relative; z-index: 1; padding: 1.5rem 2rem 3rem; }

  .section-title {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--text-dim); margin-bottom: 1rem;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* ── WATCHLIST PANEL ── */
  .watchlist-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.2rem 1.4rem;
    margin-bottom: 1.5rem;
    display: none;
    animation: fadeSlide 0.2s ease;
  }
  .watchlist-panel.visible { display: block; }
  .watchlist-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1rem;
  }
  .watchlist-title { font-size: 14px; font-weight: 700; color: var(--purple-light); }
  .watchlist-clear {
    background: none; border: none;
    color: var(--text-dim); font-size: 12px; font-family: 'Nunito', sans-serif;
    cursor: pointer;
  }
  .watchlist-clear:hover { color: #ef4444; }
  .watchlist-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .wl-chip {
    background: rgba(124,58,237,0.18);
    border: 1px solid rgba(160,100,255,0.25);
    border-radius: 20px;
    padding: 4px 10px 4px 12px;
    font-size: 12px; color: var(--text-muted);
    display: flex; align-items: center; gap: 6px;
    cursor: default;
  }
  .wl-remove {
    background: none; border: none;
    color: rgba(200,180,255,0.4);
    font-size: 14px; line-height: 1;
    cursor: pointer; padding: 0 2px;
  }
  .wl-remove:hover { color: #ef4444; }
  .wl-empty { font-size: 13px; color: var(--text-dim); text-align: center; padding: 0.5rem 0; }

  /* ── DETAIL PANEL ── */
  .detail-panel {
    background: linear-gradient(135deg, var(--card) 0%, #0f0d22 100%);
    border: 1px solid rgba(160,100,255,0.25);
    border-radius: 16px;
    padding: 1.4rem;
    margin-bottom: 1.5rem;
    display: none;
    animation: fadeSlide 0.25s ease;
    position: relative;
  }
  .detail-panel.visible { display: block; }
  @keyframes fadeSlide { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

  .dp-close {
    position: absolute; top: 12px; right: 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 28px; height: 28px;
    color: var(--text-muted); font-size: 16px;
    cursor: pointer; line-height: 26px; text-align: center;
    transition: all 0.15s;
  }
  .dp-close:hover { background: rgba(239,68,68,0.2); color: #ef4444; border-color: rgba(239,68,68,0.4); }

  .dp-inner { display: flex; gap: 1.4rem; align-items: flex-start; }
  .dp-icon {
    font-size: 72px; line-height: 1; flex-shrink: 0;
    width: 100px; height: 100px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .dp-meta { flex: 1; min-width: 0; }
  .dp-title { font-family: 'Cinzel', serif; font-size: 18px; color: var(--text); margin-bottom: 6px; }
  .dp-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .dp-tag {
    font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
    background: rgba(124,58,237,0.2);
    color: rgba(200,180,255,0.75);
    border-radius: 6px; padding: 3px 8px;
    text-transform: uppercase;
  }
  .dp-score { color: var(--gold); font-weight: 800; font-size: 20px; }
  .dp-stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; font-size: 12px; color: var(--text-muted); }
  .dp-stats strong { color: var(--text); }
  .dp-summary { font-size: 13px; color: var(--text-muted); line-height: 1.65; margin-bottom: 1rem; }
  .dp-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .dp-action {
    background: rgba(124,58,237,0.18);
    border: 1px solid rgba(160,100,255,0.3);
    border-radius: 8px; padding: 6px 14px;
    font-size: 12px; font-weight: 700; font-family: 'Nunito', sans-serif;
    color: var(--purple-light); cursor: pointer;
    transition: all 0.15s;
  }
  .dp-action:hover { background: rgba(124,58,237,0.4); }
  .dp-action.wl-toggle {
    border-color: rgba(236,72,153,0.4);
    color: var(--pink);
    background: rgba(236,72,153,0.12);
  }
  .dp-action.wl-toggle:hover { background: rgba(236,72,153,0.28); }
  .dp-action.wl-toggle.added { background: rgba(236,72,153,0.28); }

  /* ── GRID ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.22s ease, border-color 0.2s, background 0.2s, box-shadow 0.2s;
    position: relative;
    animation: cardIn 0.3s ease both;
  }
  @keyframes cardIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
  .card:hover {
    transform: translateY(-5px);
    border-color: rgba(160,100,255,0.5);
    background: var(--card-hover);
    box-shadow: 0 8px 32px rgba(124,58,237,0.15);
  }
  .card.selected { border-color: rgba(160,100,255,0.8); box-shadow: 0 0 0 2px rgba(124,58,237,0.3); }

  .card-poster {
    width: 100%; height: 140px;
    display: flex; align-items: center; justify-content: center;
    font-size: 56px;
    position: relative;
  }

  .badge-rank {
    position: absolute; top: 8px; left: 8px;
    background: rgba(124,58,237,0.88);
    color: #fff;
    font-size: 10px; font-weight: 800;
    padding: 2px 8px; border-radius: 10px;
    letter-spacing: 0.5px;
  }

  .badge-score {
    position: absolute; top: 8px; right: 8px;
    background: rgba(0,0,0,0.65);
    color: var(--gold);
    font-size: 11px; font-weight: 800;
    padding: 2px 8px; border-radius: 10px;
    display: flex; align-items: center; gap: 3px;
  }

  .badge-wl {
    position: absolute; bottom: 8px; right: 8px;
    background: rgba(236,72,153,0.85);
    color: #fff;
    font-size: 9px; font-weight: 800;
    padding: 2px 6px; border-radius: 8px;
    letter-spacing: 0.5px;
    display: none;
  }
  .badge-wl.show { display: block; }

  .card-body { padding: 10px 12px 12px; }
  .card-title { font-size: 13px; font-weight: 700; color: #e8d5ff; line-height: 1.3; margin-bottom: 5px; }
  .card-genres { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 7px; }
  .gtag {
    font-size: 10px; background: rgba(160,100,255,0.13);
    color: rgba(200,180,255,0.7);
    border-radius: 5px; padding: 2px 6px;
  }
  .card-summary {
    font-size: 11px; color: var(--text-dim); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-footer {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 9px; padding-top: 9px;
    border-top: 1px solid rgba(160,100,255,0.08);
  }
  .card-meta { font-size: 10px; color: var(--text-dim); }
  .card-fav {
    background: none; border: none;
    font-size: 14px; cursor: pointer;
    color: var(--text-dim);
    line-height: 1;
    transition: color 0.15s, transform 0.15s;
    padding: 2px 4px;
  }
  .card-fav:hover { color: var(--pink); transform: scale(1.2); }
  .card-fav.active { color: var(--pink); }

  /* ── EMPTY ── */
  .empty { text-align: center; padding: 4rem 1rem; color: var(--text-dim); }
  .empty-icon { font-size: 48px; margin-bottom: 1rem; }
  .empty-msg { font-size: 15px; }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(124,58,237,0.3); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(124,58,237,0.55); }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    header { padding: 0 1rem; gap: 1rem; }
    .controls { padding: 0.8rem 1rem; }
    .main { padding: 1rem 1rem 3rem; }
    .dp-inner { flex-direction: column; }
    .dp-icon { width: 72px; height: 72px; font-size: 48px; }
    .hero { padding: 2rem 1rem 1.5rem; }
    .hero-stats { gap: 1.5rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Anime<em>Vault</em></div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input id="searchInput" type="text" placeholder="Search title, genre, or keyword…">
  </div>
  <div class="header-actions">
    <button class="watchlist-btn" onclick="toggleWatchlist()">
      ♥ Watchlist <span class="badge" id="wlBadge">0</span>
    </button>
  </div>
</header>

<div class="hero">
  <h1 class="hero-title">
    <span class="line1">Discover Your Next</span>
    <span class="line2">Anime Obsession</span>
  </h1>
  <p class="hero-sub">Curated top-rated picks with summaries — find what to watch tonight</p>
  <div class="hero-stats">
    <div><div class="hero-stat-val" id="statTotal">25</div><div class="hero-stat-label">Anime</div></div>
    <div><div class="hero-stat-val">9.1</div><div class="hero-stat-label">Top Score</div></div>
    <div><div class="hero-stat-val" id="statGenres">8</div><div class="hero-stat-label">Genres</div></div>
  </div>
</div>

<div class="controls">
  <span class="filter-label">Genre</span>
  <button class="pill active" data-genre="all" onclick="filterGenre(this,'all')">All</button>
  <button class="pill" data-genre="action" onclick="filterGenre(this,'action')">Action</button>
  <button class="pill" data-genre="fantasy" onclick="filterGenre(this,'fantasy')">Fantasy</button>
  <button class="pill" data-genre="romance" onclick="filterGenre(this,'romance')">Romance</button>
  <button class="pill" data-genre="thriller" onclick="filterGenre(this,'thriller')">Thriller</button>
  <button class="pill" data-genre="sci-fi" onclick="filterGenre(this,'sci-fi')">Sci-Fi</button>
  <button class="pill" data-genre="slice" onclick="filterGenre(this,'slice')">Slice of Life</button>
  <button class="pill" data-genre="horror" onclick="filterGenre(this,'horror')">Horror</button>
  <button class="pill" data-genre="sports" onclick="filterGenre(this,'sports')">Sports</button>
  <div class="divider"></div>
  <span class="filter-label">Sort</span>
  <select class="sort-select" id="sortSelect" onchange="applyFilters()">
    <option value="score">Top Rated</option>
    <option value="year-desc">Newest</option>
    <option value="year-asc">Oldest</option>
    <option value="eps-desc">Most Episodes</option>
    <option value="alpha">A – Z</option>
  </select>
  <div class="divider"></div>
  <button class="pill" data-genre="watchlist" onclick="filterGenre(this,'watchlist')">♥ Watchlist</button>
</div>

<div class="main">

  <div class="watchlist-panel" id="watchlistPanel">
    <div class="watchlist-header">
      <div class="watchlist-title">♥ My Watchlist</div>
      <button class="watchlist-clear" onclick="clearWatchlist()">Clear all</button>
    </div>
    <div class="watchlist-chips" id="watchlistChips">
      <div class="wl-empty">Your watchlist is empty. Click ♥ on any anime to add it.</div>
    </div>
  </div>

  <div class="detail-panel" id="detailPanel">
    <button class="dp-close" onclick="closeDetail()">×</button>
    <div class="dp-inner">
      <div class="dp-icon" id="dpIcon"></div>
      <div class="dp-meta">
        <div class="dp-title" id="dpTitle"></div>
        <div class="dp-tags" id="dpTags"></div>
        <div style="margin-bottom:8px;"><span class="dp-score" id="dpScore"></span><span style="font-size:12px;color:var(--text-dim);margin-left:6px;">/ 10</span></div>
        <div class="dp-stats" id="dpStats"></div>
        <div class="dp-summary" id="dpSummary"></div>
        <div class="dp-actions" id="dpActions"></div>
      </div>
    </div>
  </div>

  <div class="section-title" id="sectionLabel">All anime</div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyState" style="display:none;">
    <div class="empty-icon">🔍</div>
    <div class="empty-msg">No anime found. Try a different search or filter.</div>
  </div>

</div>

<script>
const ANIME = [
  {id:1,title:"Fullmetal Alchemist: Brotherhood",icon:"⚙️",score:9.1,year:2009,eps:64,status:"Finished",genres:["action","fantasy"],bg:["#2d1507","#c2690a"],summary:"Two brothers use alchemy in a desperate bid to restore their bodies after a failed resurrection ritual. Their journey exposes a shadowy government conspiracy involving immortal beings and reveals the terrifying truth about the cost of power.",studio:"Bones"},
  {id:2,title:"Steins;Gate",icon:"⌚",score:9.0,year:2011,eps:24,status:"Finished",genres:["sci-fi","thriller"],bg:["#08101f","#2563eb"],summary:"A self-proclaimed mad scientist accidentally invents a time machine using a microwave and a phone. When he starts altering the past, he discovers that every change triggers a cascade of catastrophic consequences he may not be able to undo.",studio:"White Fox"},
  {id:3,title:"Hunter x Hunter (2011)",icon:"🎯",score:9.0,year:2011,eps:148,status:"Finished",genres:["action","fantasy"],bg:["#0a170a","#16a34a"],summary:"Gon Freecss sets out to become a licensed Hunter and find his absent father. Along the way he meets unlikely friends and faces enemies of incomprehensible power in a world that rewards determination and ingenuity above all else.",studio:"Madhouse"},
  {id:4,title:"Violet Evergarden",icon:"✉️",score:8.9,year:2018,eps:13,status:"Finished",genres:["romance","slice"],bg:["#08101a","#8b5cf6"],summary:"A former child soldier, once known only as a weapon of war, tries to rebuild her life by working as an Auto Memory Doll — writing letters for others. Through each letter she slowly discovers the meaning of love she once failed to understand.",studio:"Kyoto Animation"},
  {id:5,title:"Attack on Titan",icon:"🗡️",score:9.0,year:2013,eps:87,status:"Finished",genres:["action","thriller"],bg:["#1a0808","#dc2626"],summary:"Humanity cowers behind massive walls to escape giants that devour people. When a Colossal Titan breaches the wall and destroys his home, Eren Yeager vows revenge — and slowly uncovers the chilling truth that changes everything.",studio:"MAPPA"},

let watchlist = JSON.parse(localStorage.getItem('animevault_wl') || '[]');
let activeGenre = 'all';
let activeId = null;
let searchTerm = '';
let showingWatchlist = false;
let watchlistOpen = false;

function saveWL() { localStorage.setItem('animevault_wl', JSON.stringify(watchlist)); }
function inWL(id) { return watchlist.includes(id); }

function toggleFav(id, e) {
  e && e.stopPropagation();
  if (inWL(id)) {
    watchlist = watchlist.filter(x => x !== id);
  } else {
    watchlist.push(id);
  }
  saveWL();
  updateWLBadge();
  renderWLChips();
  document.querySelectorAll(`.card-fav[data-id="${id}"]`).forEach(b => {
    b.classList.toggle('active', inWL(id));
    b.textContent = inWL(id) ? '♥' : '♡';
  });
  document.querySelectorAll(`.badge-wl[data-id="${id}"]`).forEach(b => {
    b.classList.toggle('show', inWL(id));
  });
  if (activeId === id) updateDPActions(id);
  if (showingWatchlist) applyFilters();
}

function updateWLBadge() {
  document.getElementById('wlBadge').textContent = watchlist.length;
}

function renderWLChips() {
  const wrap = document.getElementById('watchlistChips');
  if (!watchlist.length) {
    wrap.innerHTML = '<div class="wl-empty">Your watchlist is empty. Click ♥ on any anime to add it.</div>';
    return;
  }
  wrap.innerHTML = watchlist.map(id => {
    const a = ANIME.find(x => x.id === id);
    return a ? `<div class="wl-chip">${a.icon} ${a.title}<button class="wl-remove" onclick="toggleFav(${id})">×</button></div>` : '';
  }).join('');
}

function clearWatchlist() {
  watchlist = [];
  saveWL();
  updateWLBadge();
  renderWLChips();
  document.querySelectorAll('.card-fav').forEach(b => { b.classList.remove('active'); b.textContent = '♡'; });
  document.querySelectorAll('.badge-wl').forEach(b => b.classList.remove('show'));
  if (showingWatchlist) applyFilters();
}

function toggleWatchlist() {
  watchlistOpen = !watchlistOpen;
  document.getElementById('watchlistPanel').classList.toggle('visible', watchlistOpen);
}

function filterGenre(el, genre) {
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  activeGenre = genre;
  showingWatchlist = (genre === 'watchlist');
  applyFilters();
}

function applyFilters() {
  searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
  const sort = document.getElementById('sortSelect').value;
  let res = [...ANIME];

  if (showingWatchlist) {
    res = res.filter(a => inWL(a.id));
  } else if (activeGenre !== 'all') {
    res = res.filter(a => a.genres.includes(activeGenre));
  }

  if (searchTerm) {
    res = res.filter(a =>
      a.title.toLowerCase().includes(searchTerm) ||
      a.genres.some(g => g.includes(searchTerm)) ||
      a.summary.toLowerCase().includes(searchTerm) ||
      (a.studio && a.studio.toLowerCase().includes(searchTerm))
    );
  }

  if (sort === 'score') res.sort((a,b) => b.score - a.score);
  else if (sort === 'year-desc') res.sort((a,b) => b.year - a.year);
  else if (sort === 'year-asc') res.sort((a,b) => a.year - b.year);
  else if (sort === 'eps-desc') res.sort((a,b) => b.eps - a.eps);
  else res.sort((a,b) => a.title.localeCompare(b.title));

  const label = showingWatchlist ? `My watchlist (${res.length})` :
    (activeGenre === 'all' ? `All anime (${res.length})` : `${activeGenre} · ${res.length} results`);
  document.getElementById('sectionLabel').textContent = label;

  render(res);
}

function render(list) {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  if (!list.length) { grid.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  grid.innerHTML = list.map((a, i) => `
    <div class="card${activeId === a.id ? ' selected' : ''}" onclick="showDetail(${a.id})" style="animation-delay:${Math.min(i*0.04,0.4)}s">
      <div class="card-poster" style="background:linear-gradient(135deg,${a.bg[0]},${a.bg[1]}55);">
        <span style="font-size:52px;line-height:1;">${a.icon}</span>
        <div class="badge-rank">#${i+1}</div>
        <div class="badge-score">★ ${a.score.toFixed(1)}</div>
        <div class="badge-wl${inWL(a.id)?' show':''}" data-id="${a.id}">♥ List</div>
      </div>
      <div class="card-body">
        <div class="card-title">${a.title}</div>
        <div class="card-genres">${a.genres.map(g=>`<span class="gtag">${g}</span>`).join('')}</div>
        <div class="card-summary">${a.summary}</div>
        <div class="card-footer">
          <span class="card-meta">${a.eps === 1 ? 'Film' : a.eps + ' eps'} · ${a.year}</span>
          <button class="card-fav${inWL(a.id)?' active':''}" data-id="${a.id}" onclick="toggleFav(${a.id},event)" title="${inWL(a.id)?'Remove from':'Add to'} watchlist">${inWL(a.id)?'♥':'♡'}</button>
        </div>
      </div>
    </div>
  `).join('');
}

function updateDPActions(id) {
  const a = ANIME.find(x => x.id === id);
  const wlLabel = inWL(id) ? '♥ In Watchlist' : '♡ Add to Watchlist';
  document.getElementById('dpActions').innerHTML = `
    <button class="dp-action wl-toggle${inWL(id)?' added':''}" onclick="toggleFav(${id})">${wlLabel}</button>
    <button class="dp-action" onclick="window.open('https://myanimelist.net/anime.php?q=${encodeURIComponent(a.title)}&cat=anime','_blank')">Find on MAL ↗</button>
  `;
}

function showDetail(id) {
  if (activeId === id) { closeDetail(); return; }
  activeId = id;
  const a = ANIME.find(x => x.id === id);
  document.getElementById('dpIcon').textContent = a.icon;
  document.getElementById('dpTitle').textContent = a.title;
  document.getElementById('dpTags').innerHTML = a.genres.map(g => `<span class="dp-tag">${g}</span>`).join('') + `<span class="dp-tag" style="background:rgba(0,0,0,0.3);color:var(--text-dim);">${a.status}</span>`;
  document.getElementById('dpScore').textContent = '★ ' + a.score.toFixed(1);
  document.getElementById('dpStats').innerHTML = `
    <span>Episodes: <strong>${a.eps === 1 ? 'Film' : a.eps}</strong></span>
    <span>Year: <strong>${a.year}</strong></span>
    <span>Studio: <strong>${a.studio}</strong></span>
    <span>Status: <strong style="color:${a.status==='Ongoing'?'#4ade80':'#a78bfa'}">${a.status}</strong></span>
  `;
  document.getElementById('dpSummary').textContent = a.summary;
  updateDPActions(id);
  const panel = document.getElementById('detailPanel');
  panel.classList.add('visible');
  document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
  applyFilters();
  setTimeout(() => panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 50);
}

function closeDetail() {
  activeId = null;
  document.getElementById('detailPanel').classList.remove('visible');
  applyFilters();
}

document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Escape') { e.target.value = ''; applyFilters(); }});

updateWLBadge();
renderWLChips();
applyFilters();
</script>
